  <path d="M0,0 L10,5 L0,10 z" fill="#13A89E"/></marker></defs>
  <rect width="1600" height="300" rx="20" fill="#FFFFFF"/>
  <text x="800" y="40" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#0B2545" text-anchor="middle">Partner SFTP  →  SecureTransport (on-prem, VPN)  →  Boomi Cloud</text><rect x="22" y="70" width="268" height="150" rx="14" fill="#EEF5F9" stroke="#C9D6E2" stroke-width="2"/>
