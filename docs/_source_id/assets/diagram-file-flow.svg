  <text x="469" y="106" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#1B2B3A" text-anchor="middle">2. SecureTransport 5.5</text>
  <text x="469" y="134" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#5B6B7A" text-anchor="middle">Subscription Basic</text><text x="469" y="158" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#5B6B7A" text-anchor="middle">Application auto-push</text><line x1="607" y1="145" x2="644" y2="145" stroke="#0B2545" stroke-width="3"  marker-end="url(#ah)" /><rect x="648" y="70" width="268" height="150" rx="14" fill="#EEF5F9" stroke="#C9D6E2" stroke-width="2"/>
  <text x="782" y="106" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#1B2B3A" text-anchor="middle">3. Generic-HTTP(S) site</text>
  <text x="782" y="134" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#5B6B7A" text-anchor="middle">HTTPS PUT ke listener</text><text x="782" y="158" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#5B6B7A" text-anchor="middle">Boomi</text><line x1="920" y1="145" x2="957" y2="145" stroke="#0B2545" stroke-width="3"  marker-end="url(#ah)" /><rect x="961" y="70" width="268" height="150" rx="14" fill="#E3F4F2" stroke="#13A89E" stroke-width="2"/>
  <text x="1095" y="106" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#1B2B3A" text-anchor="middle">4. Boomi listener</text>
  <text x="1095" y="134" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#5B6B7A" text-anchor="middle">OmniMFT API – ST Inbound</text><text x="1095" y="158" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#5B6B7A" text-anchor="middle">File</text><line x1="1233" y1="145" x2="1270" y2="145" stroke="#0B2545" stroke-width="3"  marker-end="url(#ah)" /><rect x="1274" y="70" width="268" height="150" rx="14" fill="#E3F4F2" stroke="#13A89E" stroke-width="2"/>
  <text x="1408" y="106" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#1B2B3A" text-anchor="middle">5. Subprocess</text>
  <text x="1408" y="134" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#5B6B7A" text-anchor="middle">Unwrap multipart →</text><text x="1408" y="158" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#5B6B7A" text-anchor="middle">validasi → audit → receipt</text><text x="1408" y="182" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#5B6B7A" text-anchor="middle">JSON</text><text x="469" y="262" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#5B6B7A" text-anchor="middle">On-premise (lab, via FortiClient VPN)</text><text x="1251.5" y="262" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#0E7C74" text-anchor="middle">Boomi Cloud (Test atom)</text></svg>